name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners advertise only `ubuntu-latest` (image: catthehacker/ubuntu:act-22.04,
# runs as root). Tooling actions (checkout, setup-node, rust-toolchain) are not
# resolvable here, so every step is inline: manual shallow checkout, Node via
# NodeSource, Rust via rustup.
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}" \
            || git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q --detach "${GITHUB_SHA}" 2>/dev/null \
            || git checkout -q --detach FETCH_HEAD

      - name: Install Node 24 + pnpm
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          node --version
          npm install -g pnpm@10
          pnpm --version

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}" \
            || git fetch -q --depth 1 origin "${GITHUB_REF}"
          git checkout -q --detach "${GITHUB_SHA}" 2>/dev/null \
            || git checkout -q --detach FETCH_HEAD

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component clippy
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
